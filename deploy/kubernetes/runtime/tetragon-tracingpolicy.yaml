# eBPF-based runtime enforcement (Tetragon). The uvicorn workload never spawns
# subprocesses, so ANY exec of a shell/interpreter inside the pod is a strong signal of
# post-exploitation (webshell, reverse shell, lateral movement). This policy traces the
# exec syscall in-kernel and SIGKILLs the offending process before it runs — detection
# AND prevention, enforced in eBPF, independent of the app's own controls.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: block-unexpected-exec
  namespace: tenant-a
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: security-api }
  kprobes:
    - call: "security_bprm_creds_for_exec"
      syscall: false
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/bin/sh"
                - "/bin/bash"
                - "/bin/dash"
                - "/usr/bin/curl"
                - "/usr/bin/wget"
                - "/usr/bin/nc"
                - "/usr/bin/python3"
          matchActions:
            - action: Sigkill
