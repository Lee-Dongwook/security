# Phase 4 — build integrity: SBOM -> keyless signing -> provenance attestation.
# Keyless cosign uses the workflow's OIDC identity (Fulcio/Rekor) — no long-lived keys.
name: Supply Chain Security

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless + SLSA provenance

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM (dependencies)
        run: python supplychain/gen_sbom.py requirements.txt > sbom.cdx.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - uses: sigstore/cosign-installer@v3

      - name: Keyless sign image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: Attest SBOM to the image
        run: |
          cosign attest --yes --predicate sbom.cdx.json \
            --type cyclonedx ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  provenance:
    needs: build-sign-attest
    # SLSA generator produces signed, non-falsifiable build provenance (SLSA Build L3).
    permissions: { actions: read, id-token: write, packages: write }
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-sign-attest.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
