name: Security & Quality CI

on:
  push:
    branches: ["main"]

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Regression Tests (Pytest)
        run: |
          python -m pytest -v

      - name: Run Static Application Security Testing (Bandit)
        run: |
          bandit -r app/ -ll

      - name: Run Software Composition Analysis (pip-audit)
        run: |
          pip-audit
        continue-on-error: true

      - name: Build Docker Image
        run: docker build -t security-lab:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "security-lab:latest"
          format: "table"
          exit-code: "0" # 실무에서는 1로 설정하여 차단하나 - 본 레포에서는 경고모드로 둠
          severity: "CRITICAL,HIGH"
        continue-on-error: true
