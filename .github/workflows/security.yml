name: Security & Quality CI

on:
  push:
    branches: ["main"]

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Regression Tests (Pytest)
        run: |
          python -m pytest -v

      - name: Run Static Application Security Testing (Bandit)
        run: |
          bandit -r app/ -ll

      - name: Run Software Composition Analysis (pip-audit)
        run: |
          pip-audit
        continue-on-error: true
